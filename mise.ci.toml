[tools]
git-cliff = "latest"

[tasks.audit]
description = "Audit locked Python dependencies"
run = "uv audit --locked"

[tasks.'actions:pin:check']
# Need github token to avoid rate limit
description = "Check for action pinned version"
run = "pinact run --check"

[tasks.'release:version']
description = "Print the next release version without the v prefix"
shell = "bash -c"
run = """
version="$(git cliff --bumped-version)"
version="${version#v}"
if [[ -z "${version}" ]]; then
  echo "git cliff did not resolve a version"
  exit 1
fi

printf '%s\\n' "${version}"
"""

[tasks.'release:tag']
description = "Print the release tag, automatically generate if RELEASE_TAG is not set"
shell = "bash -c"
run = """
tag="${RELEASE_TAG:-}"
if [[ -z "${tag}" ]]; then
  version="$(mise run release:version)"
  tag="v${version}"
fi
printf '%s\\n' "${tag}"
"""

[tasks.'release:notes']
description = "Generate release notes for RELEASE_TAG, or for the next release tag"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"

cliff_mode="--unreleased"
if git tag --points-at HEAD | grep -Fxq "${tag}"; then
  cliff_mode="--current"
fi

output="${RELEASE_NOTES_OUTPUT:-}"
if [[ -n "${output}" ]]; then
  mkdir -p "$(dirname "${output}")"
  git cliff "${cliff_mode}" --tag "${tag}" --strip all > "${output}"

  if [[ ! -s "${output}" ]]; then
    echo "Release ${tag}" > "${output}"
  fi
else
  git cliff "${cliff_mode}" --tag "${tag}" --strip all
fi
"""

[tasks.'release:changelog']
description = "Update CHANGELOG.md for RELEASE_TAG, or for the next release tag"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"

if [[ -f CHANGELOG.md ]]; then
  git cliff --unreleased --tag "${tag}" --prepend CHANGELOG.md
else
  git cliff --unreleased --tag "${tag}" --output CHANGELOG.md
fi
"""

[tasks.'release:version:sync']
description = "Set the project version in pyproject.toml to the release version"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"
version="${tag#v}"

if [[ "${version}" == "${tag}" ]]; then
  echo "release tag ${tag} does not carry a version"
  exit 1
fi

current="$(uv version --short)"
if [[ "${current}" == "${version}" ]]; then
  echo "pyproject.toml already declares version ${version}"
  exit 0
fi

uv version "${version}"
echo "Set project version ${current} -> ${version}"
"""

[tasks.'release:version:check']
description = "Verify the project version matches the release tag"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"
version="${tag#v}"
current="$(uv version --short)"

if [[ "${current}" != "${version}" ]]; then
  echo "project version ${current} does not match release tag ${tag}"
  echo "rerun the prepare release workflow to refresh the version"
  exit 1
fi

echo "Project version ${current} matches release tag ${tag}"
"""

[tasks.'container:tags']
description = "Print the container image tags for a release, one per line"
shell = "bash -c"
run = """
tag="$(mise run release:tag)"
version="${tag#v}"

if [[ "${version}" == "${tag}" ]]; then
  echo "release tag ${tag} does not carry a version"
  exit 1
fi

printf 'type=raw,value=%s\\n' "${version}"

# A prerelease must never become the "latest" image: users pulling latest expect
# the newest stable release.
if [[ "${version}" == *-* ]]; then
  exit 0
fi

printf 'type=raw,value=latest\\n'
"""
