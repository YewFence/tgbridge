name: Action Pinning

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-pin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-pin:
    name: Check Action Pins
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: pinact
          add_shims_to_path: true
          cache_key: "mise-actioncheck-{{install_args_hash}}-{{file_hash}}"

      - name: Check Action pins
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run actions:pin:check
